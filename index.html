<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Class Time Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <table>
    <caption>Class Time Table</caption>
    <tr>
      <th>Day</th>
      <th>9:00–10:00</th>
      <th>10:00–11:00</th>
      <th>11:00–11:30</th>
      <th>11:30–12:30</th>
    </tr>
    <tr>
      <th>Monday</th>
      <td>English</td>
      <td>Maths</td>
      <td class="break">Break</td>
      <td>Science</td>
    </tr>
    <tr>
      <th>Tuesday</th>
      <td>Maths</td>
      <td>Computer</td>
      <td class="break">Break</td>
      <td>English</td>
    </tr>
    <tr>
      <th>Wednesday</th>
      <td>Science</td>
      <td>English</td>
      <td class="break">Break</td>
      <td>Maths</td>
    </tr>
    <tr>
      <th>Thursday</th>
      <td>Computer</td>
      <td>Science</td>
      <td class="break">Break</td>
      <td>English</td>
    </tr>
    <tr>
      <th>Friday</th>
      <td>English</td>
      <td>Maths</td>
      <td class="break">Break</td>
      <td>Computer</td>
    </tr>
  </table>
</body>
</html>
